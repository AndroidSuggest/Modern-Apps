[package]
name = "share_nearby"
version = "0.1.0"
edition = "2021"
description = "Nearby Share / Quick Share protocol (UKEY2, protobuf frames, secure messages, payload) without Play Services — Rust core exposed to Kotlin via JNI. See share/PROTOCOL_CONTRACT.md."
license = "GPL-2.0-only"

[lib]
name = "share_nearby"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
# Workspace-pinned crypto
sha2.workspace = true
hmac.workspace = true
aes.workspace = true
rand_core.workspace = true
getrandom.workspace = true
# Wire / protocol (versions pinned in the workspace root Cargo.toml)
prost.workspace = true
bytes.workspace = true
hkdf.workspace = true
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
cbc = { workspace = true, features = ["alloc"] }
cipher.workspace = true
# BetoCore vendored crates (P0 wiring — protocol code not yet migrated)
np_adv = { workspace = true, features = ["std"] }
ukey2_connections = { workspace = true }
crypto_provider_default = { workspace = true, features = ["rustcrypto", "std"] }
