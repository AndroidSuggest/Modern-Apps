[package]
name = "network_location_position_estimation_rust"
version = "0.1.0"
edition = "2021"
description = "Robust device-position estimation (RANSAC + Expectation-Maximization multilateration) for the network location provider, via JNI. Ported from GrapheneOS NetworkLocation (MIT)."
license = "MIT"

[lib]
name = "network_location_position_estimation_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
log.workspace = true
itertools = "0.14"
# Runtime geocoder search reads geocoder.geodb and only ever DECOMPRESSES zstd blocks, so we
# use the pure-Rust decoder (no NDK C toolchain needed to cross-compile for Android).
ruzstd = "0.7"
libc = "0.2"

[dev-dependencies]
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
