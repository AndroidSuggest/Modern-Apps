[package]
name = "network_location_position_estimation_rust"
version = "0.1.0"
edition = "2021"
description = "Robust device-position estimation (RANSAC + Expectation-Maximization multilateration) for the network location provider, via JNI. Ported from GrapheneOS NetworkLocation (MIT)."
license = "MIT"

[lib]
# Must match `rustNativeLib("networklocation")` in build.gradle.kts and
# `System.loadLibrary("networklocation")` in the Kotlin loaders: cargo emits `lib<name>.so`,
# which RustNative.kt copies into jniLibs. The descriptive package name above stays as-is.
name = "networklocation"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
log.workspace = true
itertools.workspace = true
# Runtime geocoder search reads geocoder.geodb and only ever DECOMPRESSES zstd blocks, so we
# use the pure-Rust decoder (no NDK C toolchain needed to cross-compile for Android).
ruzstd.workspace = true
libc.workspace = true

[dev-dependencies]
rand = { workspace = true, features = ["std_rng"] }
