[package]
name = "networklocation"
version = "0.1.0"
edition = "2021"
description = "Native device-position estimation (weighted-centroid / inverse-variance least squares over Apple gs-loc beacon fixes) for the network location provider, via JNI"
license = "GPL-2.0-only"

[lib]
name = "networklocation"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
