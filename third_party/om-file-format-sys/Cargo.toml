[package]
name = "om-file-format-sys"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-only"
authors = ["Terraputix <terraputix@mailbox.org>"]
description = "Rust bindings for om-file-format C code (armv8-only, bindgen removed)"
repository = "https://github.com/open-meteo/om-file-format"

build = "build.rs"
include = [
    "c/include/**/*.h",
    "c/src/**/*.c",
    "src/**/*",
    "Cargo.toml",
    "build.rs",
]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = { version = "1.2" }
# bindgen removed – bindings pre-generated into src/bindings.rs to cut ~20 crates from weather lock
