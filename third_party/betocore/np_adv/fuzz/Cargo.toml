[package]
name = "np_adv_fuzz"
version = "0.1.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(fuzzing)", "cfg(rust_analyzer)"]

[dependencies]
arbitrary.workspace = true
derive_fuzztest.workspace = true
np_adv = { path = "..", features = ["testing"] }
crypto_provider = { path = "../../crypto_provider", default-features = false }
crypto_provider_default = { path = "../../crypto_provider_default", default-features = false, features = ["std", "rustcrypto"] }

[target.'cfg(fuzzing)'.dependencies]
libfuzzer-sys.workspace = true

[[bin]]
name = "actions_de_deser"
doc = false

[[bin]]
name = "actions_de_encoder"
doc = false

[[bin]]
name = "actions_de_roundtrip"
doc = false

[[bin]]
name = "actions_bitmap_encoder"
doc = false

# Member of the repo-root workspace (single root Cargo.lock).
