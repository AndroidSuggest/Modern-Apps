[package]
name = "camera_stitch"
version = "0.1.0"
edition = "2021"
description = "Feature-based panorama stitcher + night burst aligner for the camera app, armv8-only stdlib"
license = "GPL-2.0-only"

[lib]
name = "camera_stitch"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
# image crate 0.25 removed – pulled moxcms/pxfm/bytemuck; now jpeg-decoder + jpeg-encoder (trivial 1-function)
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.6.1", default-features = false }
# nalgebra removed – replaced by a tiny in-crate linalg module (src/linalg.rs):
# fixed 3×3 Matrix3/Vector3, closed-form inverse, Jacobi symmetric-eigen, SVD
# (3×3 + dense DLT null-space), and partial-pivot LU solve. Drops ~9 transitive
# crates (simba, wide, safe_arch, bytemuck, approx, paste, num-rational,
# num-iter, nalgebra-macros).
# rayon removed – was 6 crates (crossbeam-deque/epoch/utils/either/rayon-core) for par_iter in bundle/matching/stitch – now std iter (prefer stdlib)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
