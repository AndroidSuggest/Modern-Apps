[workspace]
members = [
  "astronomy/src/main/rust",
  "photos/src/main/rust",
  "office/src/main/rust",
  "weather/src/main/rust",
  "pdf/src/main/rust",
  "camera/src/main/rust",
  "maps/src/main/rust",
  "passwords/src/main/rust",
  "vpn/src/main/rust",
  "library/e2ee-p2p/src/main/rust",
  "third_party/om-file-format-sys",
]
resolver = "2"

# Centralized Rust versions – armv8-only (aarch64-linux-android)

[workspace.dependencies]
jni = { path = "third_party/jni-android", version = "0.21" }
jni-sys = "0.3.1"
cesu8 = "1.1.0"
# combine removed – jni-android now parses JNI signatures by hand (no combine, no bytes)
thiserror = { version = "2" }
log = "0.4.33"
cfg-if = "1.0.4"

serde = { version = "1.0.228", features = ["derive"] }
serde_core = "1.0.228"
proc-macro2 = "1.0.92"
quote = "1.0.40"
syn = "2.0.101"
itoa = "1.0.15"
memchr = "2.8.3"
serde_json = "1.0.149"

# Imaging – image crate 0.25->moxcms/pxfm removed, use tiny jpeg-encoder/decoder (1 function per your rule)
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.6.1", default-features = false }
flate2 = "1.1.4"

# Crypto / PQC (features preserved – no feature loss)
sha2 = { version = "0.10.9", features = ["oid"] }
aes = "0.8.4"
md-5 = "0.10.6"
keepass = { version = "0.13.17", default-features = false, features = ["save_kdbx4"] }
fips203 = "0.4.3"
fips204 = "0.4.6"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand = "0.8.5"
getrandom = "0.2.15"
# x509-cert / cms / spki / rsa removed with the PDF signature-creation feature.
der = { version = "0.7.10", features = ["alloc", "oid"] }
const-oid = { version = "0.9.6", features = ["db"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
# weezl, cbc removed – std LZW + own CBC in pdf_cbc.rs (single function, prefer stdlib)
fax = "0.3.0"
hayro-jbig2 = { version = "0.3.0", default-features = false, features = ["std"] }
openjp2 = "0.6.1"
lopdf = { version = "0.36", default-features = false, features = ["serde"] }
libc = "0.2.171"
indexmap = { version = "2.10.0" }
hashbrown = "0.14.5"
byteorder = "1.5.0"
smallvec = "1.14.0"
# bytes removed – it was only ever pulled transitively by combine (now gone from jni-android)

# OM weather – ureq (~90 crates ring/rustls/icu/url) removed
# omfiles / memmap2 / ndarray removed – weather uses its own sync src/om.rs on top of
# the vendored om-file-format-sys C lib (see weather/src/main/rust/Cargo.toml).

# Build
cc = { version = "1.2.8", features = ["parallel"] }

# Minimal platform
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.64"
crossbeam-utils = "0.8.21"
crossbeam-epoch = "0.9.18"
crossbeam-deque = "0.8.6"
either = "1.13.0"
rayon = "1.11.0"
rayon-core = "1.13.0"
# nalgebra removed – camera now uses its own src/linalg.rs (see camera Cargo.toml)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
