[workspace]
members = [
  "astronomy/src/main/rust",
  "photos/src/main/rust",
  "office/src/main/rust",
  "weather/src/main/rust",
  "pdf/src/main/rust",
  "camera/src/main/rust",
  "passwords/src/main/rust",
  "library/e2ee-p2p/src/main/rust",
  "third_party/om-file-format-sys",
]
resolver = "2"

# Centralized Rust versions – armv8-only (aarch64-linux-android)
# Mirrors gradle/libs.versions.toml. Update here to update all 8 native crates.

[workspace.dependencies]
# JNI local fork (third_party/jni-android): removed build-dep walkdir (same-file/winapi-util/windows-sys)
# Saves ~11 crates per lock, 0 Windows in normal Android edges.
jni = { path = "third_party/jni-android", version = "0.21" }
jni-sys = "0.3.1"
cesu8 = "1.1.0"
combine = "4.6.7"
thiserror = { version = "1.0.69" }
log = "0.4.33"
cfg-if = "1.0.4"

# Serialization – unified single version
serde = { version = "1.0.228", features = ["derive"] }
serde_core = "1.0.228"
proc-macro2 = "1.0.92"
quote = "1.0.40"
syn = "2.0.101"
itoa = "1.0.15"
memchr = "2.8.3"
serde_json = "1.0.149"

# Imaging – image crate removed (was moxcms/pxfm), use tiny jpeg-encoder/decoder
jpeg-decoder = "0.3.2"
jpeg-encoder = { version = "0.6.1", default-features = false }
flate2 = "1.1.4"

# Crypto / PQC (features preserved per no-feature-loss constraint)
sha2 = { version = "0.10.9", features = ["oid"] }
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
md-5 = "0.10.6"
keepass = { version = "0.13.17", default-features = false, features = ["save_kdbx4"] }
fips203 = "0.4.3"
fips204 = "0.4.6"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand = "0.8.5"
getrandom = "0.2.15"
x509-cert = { version = "0.2.5", features = ["builder"] }
cms = { version = "0.2.3", features = ["builder"] }
der = { version = "0.7.10", features = ["alloc", "oid"] }
spki = "0.7.3"
const-oid = { version = "0.9.6", features = ["db"] }
rsa = { version = "0.9.10", features = ["sha2"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
weezl = "0.1.7"
fax = "0.3.0"
hayro-jbig2 = { version = "0.3.0", default-features = false, features = ["std"] }
openjp2 = "0.6.1"
lopdf = { version = "0.36.0", features = ["serde"] }
libc = "0.2.171"
indexmap = "2.10.0"
hashbrown = "0.14.5"
byteorder = "1.5.0"
smallvec = "1.14.0"
bytes = "1.12.1"

# OM weather decoder – ureq removed (was ~90 crates ring/rustls/icu/url)
omfiles = { git = "https://github.com/open-meteo/rust-omfiles", rev = "8ce3f893f444239a9d0e5db9af40895ba11e5bfc" }
memmap2 = "0.9"
ndarray = "0.17"

# Build
cc = { version = "1.2.8", features = ["parallel"] }

# Keep platform bloat minimal – chrono clock only, no Windows
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1.64"
crossbeam-utils = "0.8.21"
crossbeam-epoch = "0.9.18"
crossbeam-deque = "0.8.6"
either = "1.13.0"
rayon = "1.11.0"
rayon-core = "1.13.0"
nalgebra = "0.33.2"

[patch."https://github.com/open-meteo/om-file-format"]
om-file-format-sys = { path = "third_party/om-file-format-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
