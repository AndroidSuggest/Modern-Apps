[package]
name = "pdf_render"
version = "0.1.0"
edition = "2021"
description = "Memory-safe PDF content-stream interpreter (lopdf) for the 'Open PDF (safe)' viewer, exposed to Kotlin via JNI"
license = "GPL-2.0-only"

[lib]
name = "pdf_render"
crate-type = ["cdylib"]

[dependencies]
# Root catalog pins single version per crate (see /Cargo.toml)
# armv8-only: aarch64-linux-android target, no windows/wasm deps in normal edges.
# lopdf default includes chrono->windows-link + jiff + time + rayon – not needed for core filter/crypto/image extraction path we use in safe viewer.
# Trim default to only serde (still safe for XObject parsing). Date fields fallback to None if feature disabled.
lopdf = { version = "0.36", default-features = false, features = ["serde"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "glyph-names"] }
jni.workspace = true
jpeg-decoder = { version = "0.3.2", default-features = false }
fax.workspace = true
flate2.workspace = true
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }

openjp2.workspace = true
md-5.workspace = true
aes.workspace = true
sha2 = { version = "0.10", features = ["oid"] }
indexmap = { version = "2.10.0" }
getrandom.workspace = true

# Signing (features preserved per no-feature-loss)
# PDF signature *creation* removed as a feature – dropped rsa/cms/x509-cert/spki/const-oid
# (and their num-bigint-dig/pkcs1/pkcs8/signature/sha1/spin/lazy_static/num-iter subtree).
# der + rand stay: der is used pervasively for ASN.1 (fonts/filters/decrypt), rand is used
# by decrypt.rs (OsRng) for encryption. const-oid still comes in transitively via der.
rand.workspace = true
der.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
