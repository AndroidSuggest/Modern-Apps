[package]
name = "pdf_render"
version = "0.1.0"
edition = "2021"
description = "Memory-safe PDF content-stream interpreter (lopdf) for the 'Open PDF (safe)' viewer, exposed to Kotlin via JNI"
license = "GPL-2.0-only"

[lib]
name = "pdf_render"
crate-type = ["cdylib"]

[dependencies]
lopdf = { version = "0.36", features = ["serde"] }
jni = "0.21"
jpeg-decoder = "0.3"
weezl = "0.1"
fax = "0.3"
flate2 = "1.1"
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }

openjp2 = "0.6"
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = { version = "0.10", features = ["oid"] }
indexmap = "2"
# Use getrandom 0.2 to match rand 0.8 (avoids duplicate getrandom 0.2 + 0.3 in .so ~30KB bloat)
getrandom = "0.2"

# Detached CMS/PKCS#7 signing (replaces Bouncy Castle on the Kotlin side).
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
x509-cert = { version = "0.2", features = ["builder"] }
cms = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Must be unwind for JNI – abort would kill JVM process on any panic. Panics are caught
# via catch_unwind in jni_bindings.rs and translated to Java null/0 returns.
panic = "unwind"
# Keep debuginfo for Play Console stack traces, strip only debug symbols not needed at runtime
strip = "debuginfo"
