[package]
name = "offlinerouter"
version = "0.1.0"
edition = "2021"
description = "Offline routing engine + traffic MVT tile encoder for the Maps app, exposed to Kotlin via JNI"
license = "GPL-2.0-only"

[lib]
name = "offlinerouter"
crate-type = ["cdylib", "rlib"]

[dependencies]
# JNI surface (armv8-only). Upstream jni from crates.io; see the root Cargo.toml.
jni.workspace = true
# mmap of the whole-world graph (nodes/edges/intermediate/…), mirroring the old
# C++ router's mmap loader. Direct libc rather than memmap2 to keep the dep tree
# minimal (memmap2 was intentionally dropped from the workspace).
libc.workspace = true
# gzip for the traffic MVT tiles served to MapLibre (replaces the C++ zlib deflate).
flate2.workspace = true
# The single-archive reader (header + ArchiveView): the same code the renderer
# reads .mamaps with, so the loader and the writer cannot drift. Read path
# only — no `write` feature, keeping the interner out of the cdylib per the
# crate's own rule. Path dep, not workspace: tilecodec is detached (see its
# Cargo.toml), the same way library/map's Rust consumes it.
tilecodec = { path = "../../../../library/tilecodec/src/main/rust" }

# Patch inherited from workspace root Cargo.toml.
