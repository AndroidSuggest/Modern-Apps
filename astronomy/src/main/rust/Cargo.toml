[package]
name = "astronomy_engine"
version = "0.1.0"
edition = "2021"
description = "Native celestial coordinate transforms + stereographic sky projection for the astronomy app, via JNI"
license = "GPL-2.0-only"

[lib]
name = "astronomy_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
