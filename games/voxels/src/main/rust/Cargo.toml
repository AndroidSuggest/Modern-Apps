[workspace]

[workspace.dependencies]
# Mirrors root workspace catalog to avoid duplicate JNI/Walkdir/Windows pulling in voxels
jni = { path = "../../../../../third_party/jni-android", version = "0.21" }

[package]
name = "voxels_engine"
version = "0.1.0"
edition = "2021"
description = "Full Rust + Vulkan (ash) Minecraft-like voxel engine - chunked world, greedy meshing, Perlin terrain, physics, raycast, save/load, Matcha texture atlas"
license = "GPL-2.0-only"

[lib]
name = "voxels_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
ash = { version = "0.38", default-features = false, features = ["loaded"] }
hashbrown = "0.14"
noise = "0.8"
glam = { version = "0.27", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
