[package]
name = "weather_om"
version = "0.1.0"
edition = "2021"
description = "Native .om decoder for the Weather app map, exposed to Kotlin via JNI"
license = "GPL-2.0-only"

[lib]
name = "weather_om"
crate-type = ["cdylib", "rlib"]

[dependencies]
omfiles = { git = "https://github.com/open-meteo/rust-omfiles", rev = "8ce3f893f444239a9d0e5db9af40895ba11e5bfc" }
# ureq removed – it pulled ring 0.17 + rustls 0.23 + webpki-roots x2 + icu_* x4 + url/form_urlencoded/idna (~100 crates)
# for a single Range GET. Now Kotlin NetworkClient (HttpURLConnection, armv8-only) fetches .om bytes and passes slice to Rust.
jni.workspace = true

# Patch moved to workspace root Cargo.toml

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
