[package]
name = "weather_om"
version = "0.1.0"
edition = "2021"
description = "Native .om decoder for the Weather app map, exposed to Kotlin via JNI"
license = "GPL-2.0-only"

[lib]
name = "weather_om"
crate-type = ["cdylib", "rlib"]

[dependencies]
# omfiles crate removed – it pulled an async runtime (async-executor/async-lock/futures/…)
# + ndarray (~17 crates) for a synchronous 2D read. Replaced by src/om.rs, a thin sync
# reader calling the vendored C lib directly. The C decode/parse lives in om-file-format-sys.
om-file-format-sys = { path = "../../../../third_party/om-file-format-sys" }
# ureq removed – it pulled ring 0.17 + rustls 0.23 + webpki-roots x2 + icu_* x4 + url/form_urlencoded/idna (~100 crates)
# for a single Range GET. Now Kotlin NetworkClient (HttpURLConnection, armv8-only) fetches .om bytes and passes slice to Rust.
jni.workspace = true

# Patch moved to workspace root Cargo.toml

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
