[package]
name = "vpn_wireguard"
version = "0.1.0"
edition = "2021"
description = "WireGuard VPN tunnel implementation based on Mullvad's gotatun (BoringTun fork)"
license = "MPL-2.0"

[lib]
name = "vpn_wireguard"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
base64.workspace = true
x25519-dalek = { workspace = true, features = ["reusable_secrets", "static_secrets", "getrandom"] }
aead.workspace = true
chacha20poly1305.workspace = true
blake2.workspace = true
# hmac 0.13 (digest 0.11 stack) to match the blake2 0.11 pin above and the
# workspace hmac pin: SimpleHmac<Blake2s256> mixes both crates' traits, so they
# must share one digest major. (Same class as the communicate hmac 0.12->0.13 fix.)
hmac.workspace = true
rand.workspace = true
rand_core.workspace = true
getrandom.workspace = true
bytes.workspace = true
parking_lot.workspace = true
zerocopy = { workspace = true, features = ["derive", "std"] }
constant_time_eq.workspace = true
typed-builder.workspace = true
bitfield-struct.workspace = true
either.workspace = true
libc.workspace = true
hex.workspace = true
duplicate.workspace = true
eyre.workspace = true
tracing = { workspace = true, default-features = false, features = ["std"] }
thiserror.workspace = true
