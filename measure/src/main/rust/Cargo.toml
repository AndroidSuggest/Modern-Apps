[package]
name = "measure_vio"
version = "0.1.0"
edition = "2021"
description = "Monocular visual-inertial odometry for the measure app: metric-scale camera tracking from camera frames plus IMU, via JNI"
license = "GPL-2.0-only"

[lib]
name = "measure_vio"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
# Shared CV primitives. Default features only: no JPEG codec, since frames arrive
# as raw camera luminance planes.
vision_core = { path = "../../../../library/vision/src/main/rust" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
