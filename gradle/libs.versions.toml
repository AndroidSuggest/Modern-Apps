# On-device AI
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntimeAndroid" }

# Crypto, security & credential storage
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptographyCore" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptographyCore" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipherAndroid" }
libsignal-android = { module = "org.signal:libsignal-android", version.ref = "libsignalAndroid" }

# Mail & XML
jakarta-mail = { module = "org.eclipse.angus:jakarta.mail", version.ref = "jakartaMail" }
kxml2 = { module = "net.sf.kxml:kxml2", version.ref = "kxml2" }

# Payments, telephony & auth
stripe-android = { module = "com.stripe:stripe-android", version.ref = "stripe" }
appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }

# Own libraries (vayun-mathur, via JitPack)
stockfish-library = { module = "com.github.vayun-mathur:Stockfish-Library", version.ref = "stockfishLibrary" }
ncnn-android = { module = "com.github.vayun-mathur:ncnn-android", version.ref = "ncnnAndroid" }

# AppStore – Play install via Aurora
auroraoss-gplayapi = { module = "com.auroraoss:gplayapi", version.ref = "gplayapi" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]

