# Google libraries
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobufJavalite" }
google-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlmAndroid" }
brotli-dec = { module = "org.brotli:dec", version.ref = "brotli" }

# =============================================================================
# THIRD PARTY
# =============================================================================

# Networking (Square)
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" } # isolated: contacts/files + messages ByteString
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" } # isolated: media3-datasource-okhttp + Vonage SDK

# Images
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coilCompose" }
coil-video = { module = "io.coil-kt:coil-video", version.ref = "coilCompose" }

# Replaces coil-svg
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }

# Maps & geospatial
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibre" }
flatgeobuf = { module = "org.wololo:flatgeobuf", version.ref = "flatgeobuf" }

# JavaScript engines & HTML
# rhino 1.9.0 requires Android minSDK >= 26; rhino-engine only published for 1.8.x
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
rhino-engine = { module = "org.mozilla:rhino-engine", version.ref = "rhino" }
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }
