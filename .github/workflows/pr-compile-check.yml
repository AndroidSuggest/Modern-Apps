name: "✅ PR Compile Check"

on:
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change Gradle Wrapper Permissions
        run: chmod +x ./gradlew

      - name: Check All Apps Compile
        run: ./gradlew :compileDebugKotlin
