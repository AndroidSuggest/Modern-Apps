// Google Automotive Link sensor channel (service 7, SENSOR_SOURCE): the car
// streams readings, the phone subscribes.
//
// Direction (auto/docs/FINDINGS.md section 2, the `rvb` endpoint): phone ->
// HU SensorRequest (0x8001, `xnu` {1 sensor_type, 2 min_update_period},
// synchronous with a 2000 ms timeout, -1 unsubscribes); HU -> phone
// SensorResponse (0x8002, `xnv`), SensorBatch (0x8003, `xnr`) and SensorError
// (0x8004, `xns`). 0x8004 here is SensorError, NOT MediaAck: scope every
// parse by channel id (VideoSinkChannel and InputChannel already do; the 0x04
// CONTROL frame flag never enters routing -- HANDOFF.md section 9).
//
// Provenance: the 26 sensor-type names and their order come from the APK's
// `xny` enum via the `rvb.j()` dumper (FINDINGS.md section 2), numbered
// 1-based in that order. The `xnu` field numbers (1, 2) are from the
// teardown; every other field number below is MA sender-defined -- the
// teardown never recovered the `xnv`/`xnr`/`xns` layouts. Exact-bytes tests
// pin OUR numbering so an accidental renumber fails here, not at a DHU that
// silently ignores us. If the teardown ever recovers those layouts, re-pin
// this file against them like gal/input.proto.
//
// Stub phase (Phase 5): the phone subscribes to LOCATION, NIGHT_MODE, SPEED
// and DRIVING_STATUS_DATA only -- parked, night-follows-phone, last-known
// location, speed 0 -- and observes whatever batches come back. Full live
// values (phone GPS feed, maps wiring) land with Phase 6 maps-dev through
// the SensorChannel onValues seam.

syntax = "proto2";

package gal;

option java_package = "com.vayunmathur.auto.protocol.gal";
option java_multiple_files = true;

// `xny`, in dumper order. Names are the FINDINGS.md names, not aasdk's.
enum SensorType {
  LOCATION = 1;
  COMPASS = 2;
  SPEED = 3;
  RPM = 4;
  ODOMETER = 5;
  FUEL = 6;
  PARKING_BRAKE = 7;
  GEAR = 8;
  OBDII_DIAGNOSTIC_CODE = 9;
  NIGHT_MODE = 10;
  ENVIRONMENT_DATA = 11;
  HVAC_DATA = 12;
  DRIVING_STATUS_DATA = 13;
  DEAD_RECKONING_DATA = 14;
  PASSENGER_DATA = 15;
  DOOR_DATA = 16;
  LIGHT_DATA = 17;
  TIRE_PRESSURE_DATA = 18;
  ACCELEROMETER_DATA = 19;
  GYROSCOPE_DATA = 20;
  GPS_SATELLITE_DATA = 21;
  TOLL_CARD = 22;
  VEHICLE_ENERGY_MODEL_DATA = 23;
  TRAILER_DATA = 24;
  RAW_VEHICLE_ENERGY_MODEL = 25;
  RAW_EV_TRIP_SETTINGS = 26;
}

// 0x8001, phone -> HU: subscribe. `xnu` fields 1-2, from the teardown.
// Omit the period for the head unit's default rate; -1 unsubscribes (see
// GalMessage.Sensor.UNSUBSCRIBE_PERIOD).
message SensorRequest {
  required SensorType sensor_type = 1;
  optional int64 min_update_period_ms = 2;
}

// 0x8002, HU -> phone: subscription answer. MA sender-defined: the teardown
// recovered the id but not the `xnv` layout. Status 0 means subscribed.
message SensorResponse {
  required SensorType sensor_type = 1;
  optional int32 status = 2;
}

// 0x8003, HU -> phone: streamed readings. MA sender-defined, same caveat.
message SensorBatch {
  repeated SensorEvent events = 1;
}

// One reading. The declared type attributes the event; the payload present
// carries the value. An event with no payload is counted but changes no
// value -- the owner keeps its last-known rather than clobbering it.
//
// Envelope numbers (2-25) are MA sender-defined, continuing the existing
// sequence. The payload INNER layouts below are teardown-exact where noted
// (`dump_protos.py` over the `xnr` field classes): numbers, wire types and
// cardinality recovered, names `fieldN` per the repo convention for
// unrecovered names (see gal/input.proto). Two types carry no payload:
// VEHICLE_ENERGY_MODEL_DATA(23) (`xgu` decodes as a proto3 single-message
// anomaly, not a usable reading layout) and TRAILER_DATA(24) (`xon`
// descriptor is empty) -- both fold to last-known with MISSING-payload
// comments in SensorSnapshot.withEvents, never invented bytes.
message SensorEvent {
  required SensorType sensor_type = 1;
  optional LocationReading location = 2;
  optional CompassReading compass = 3;
  optional SpeedReading speed = 4;
  optional NightReading night = 5;
  optional DrivingStatusReading driving_status = 6;
  optional RpmReading rpm = 7;
  optional OdometerReading odometer = 8;
  optional FuelReading fuel = 9;
  optional ParkingBrakeReading parking_brake = 10;
  optional GearReading gear = 11;
  optional ObdiiReading obdii = 12;
  optional EnvironmentReading environment = 13;
  optional HvacReading hvac = 14;
  optional DeadReckoningReading dead_reckoning = 15;
  optional PassengerReading passenger = 16;
  optional DoorReading door = 17;
  optional LightReading light = 18;
  optional TirePressureReading tire_pressure = 19;
  optional AccelerometerReading accelerometer = 20;
  optional GyroscopeReading gyroscope = 21;
  optional GpsSatelliteReading gps_satellite = 22;
  optional TollCardReading toll_card = 23;
  optional RawVehicleEnergyReading raw_vehicle_energy = 24;
  optional RawEvTripReading raw_ev_trip = 25;
}

message LocationReading {
  optional int64 latitude_e7 = 1;
  optional int64 longitude_e7 = 2;
  optional int32 accuracy_m = 3;
  optional int64 timestamp_ms = 4;
}

message CompassReading {
  optional int32 heading_deg = 1;
}

message SpeedReading {
  optional double speed_mps = 1;
}

message NightReading {
  optional bool is_night = 1;
}

message DrivingStatusReading {
  optional bool parked = 1;
}

// RPM(4) body (`xnq`), from the teardown: required int32 field 1.
message RpmReading {
  required int32 field1 = 1;
}

// ODOMETER(5) body (`xlu`), from the teardown: required int32 field 1,
// optional int32 field 2.
message OdometerReading {
  required int32 field1 = 1;
  optional int32 field2 = 2;
}

// FUEL(6) body (`xjj`), from the teardown: three optional int32 fields.
message FuelReading {
  optional int32 field1 = 1;
  optional int32 field2 = 2;
  optional int32 field3 = 3;
}

// PARKING_BRAKE(7) body (`xly`), from the teardown: required bool field 1.
message ParkingBrakeReading {
  required bool field1 = 1;
}

// GEAR(8) body (`xjl`), from the teardown: required enum field 1. The enum
// type itself is unidentified, so int32 here -- identical varint encoding on
// the wire -- rather than an invented enum.
message GearReading {
  required int32 field1 = 1;
}

// OBDII_DIAGNOSTIC_CODE(9) body (`xjb`), from the teardown: optional bytes
// field 1 (raw diagnostic payload).
message ObdiiReading {
  optional bytes field1 = 1;
}

// ENVIRONMENT_DATA(11) body (`xjg`), from the teardown: three optional
// int32 fields.
message EnvironmentReading {
  optional int32 field1 = 1;
  optional int32 field2 = 2;
  optional int32 field3 = 3;
}

// HVAC_DATA(12) body (`xjr`), from the teardown: two optional int32 fields.
message HvacReading {
  optional int32 field1 = 1;
  optional int32 field2 = 2;
}

// DEAD_RECKONING_DATA(14) body (`xja`), from the teardown: optional int32
// field 1, repeated (unpacked) int32 field 2.
message DeadReckoningReading {
  optional int32 field1 = 1;
  repeated int32 field2 = 2;
}

// PASSENGER_DATA(15) body (`xlz`), from the teardown: optional bool field 1.
message PassengerReading {
  optional bool field1 = 1;
}

// DOOR_DATA(16) body (`xjd`), from the teardown: two optional bools plus a
// repeated bool field 3 (per-door states).
message DoorReading {
  optional bool field1 = 1;
  optional bool field2 = 2;
  repeated bool field3 = 3;
}

// LIGHT_DATA(17) body (`xkg`), from the teardown: two optional enums plus an
// optional bool. Both enum types are unidentified, so int32 -- identical
// varint encoding -- rather than invented enums.
message LightReading {
  optional int32 field1 = 1;
  optional int32 field2 = 2;
  optional bool field3 = 3;
}

// TIRE_PRESSURE_DATA(18) body (`xoj`), from the teardown: repeated
// (unpacked) int32 field 1, one entry per wheel.
message TirePressureReading {
  repeated int32 field1 = 1;
}

// ACCELEROMETER_DATA(19) body (`xgy`), from the teardown: three optional
// int32 fields (x/y/z axes).
message AccelerometerReading {
  optional int32 field1 = 1;
  optional int32 field2 = 2;
  optional int32 field3 = 3;
}

// GYROSCOPE_DATA(20) body (`xjp`), from the teardown: three optional int32
// fields (x/y/z axes).
message GyroscopeReading {
  optional int32 field1 = 1;
  optional int32 field2 = 2;
  optional int32 field3 = 3;
}

// One satellite fix inside a GPS_SATELLITE_DATA body (`xjn`), from the
// teardown: required int32 fields 1-2, required bool field 3, optional
// int32 fields 4-5.
message GpsSatelliteEntry {
  required int32 field1 = 1;
  required int32 field2 = 2;
  required bool field3 = 3;
  optional int32 field4 = 4;
  optional int32 field5 = 5;
}

// GPS_SATELLITE_DATA(21) body (`xjo`), from the teardown: required int32
// field 1, optional int32 field 2, repeated `xjn` entries field 3.
message GpsSatelliteReading {
  required int32 field1 = 1;
  optional int32 field2 = 2;
  repeated GpsSatelliteEntry field3 = 3;
}

// TOLL_CARD(22) body (`xok`), from the teardown: required bool field 1.
message TollCardReading {
  required bool field1 = 1;
}

// RAW_VEHICLE_ENERGY_MODEL(25) body (`xnk`), from the teardown: optional
// bytes field 1 (opaque model blob).
message RawVehicleEnergyReading {
  optional bytes field1 = 1;
}

// RAW_EV_TRIP_SETTINGS(26) body (`xni`), from the teardown: optional bytes
// field 1 (opaque settings blob).
message RawEvTripReading {
  optional bytes field1 = 1;
}

// 0x8004, HU -> phone: a subscription or stream failure. MA sender-defined,
// same caveat as SensorResponse. Observed, never fatal -- the bring-up and
// video carry on.
message SensorError {
  required SensorType sensor_type = 1;
  optional int32 status = 2;
}
