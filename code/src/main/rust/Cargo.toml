# Native tree-sitter highlighter for the `code` app (`libcode_ts.so`, arm64-v8a).
#
# Member of the repo-root workspace (single root Cargo.lock). The Gradle build is
# opt-in via the `-PenableTreeSitter` property (see code/build.gradle.kts); when it
# isn't built, the app still runs: `TreeSitterNative.isAvailable` is false and the
# editor uses the regex highlighter.
#
# The grammar crate versions below must be a set that mutually agree on the tree-sitter 0.22 ABI and
# expose `LANGUAGE` (a `LanguageFn`) + a highlights query constant; run `cargo update` on a
# toolchain-equipped machine to generate the matching Cargo.lock before an `--locked` build.
[package]
name = "code_ts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "code_ts"
crate-type = ["cdylib"]

[dependencies]
jni.workspace = true
tree-sitter.workspace = true
tree-sitter-kotlin.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-go.workspace = true
tree-sitter-json.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true

[profile.release]
opt-level = "z"
lto = true
strip = true
