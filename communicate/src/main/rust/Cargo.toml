[package]
name = "communicate_signal"
version = "0.1.0"
edition = "2021"
description = "Classic Signal protocol v3 (X3DH + Double Ratchet + Sender Keys) for the WhatsApp primary client in communicate, exposed to Kotlin over JNI. Self-contained copy of the messages whatsapp_signal crate (messages must not be modified per repo rule)."
license = "GPL-2.0-only"

[lib]
name = "communicate_signal"
crate-type = ["cdylib", "rlib"]

[dependencies]
curve25519-dalek.workspace = true
x25519-dalek.workspace = true
sha2.workspace = true
# hmac 0.13 (digest 0.11 stack) to match the workspace sha2 0.11 pin: Hmac<Sha256>
# mixes both crates' traits, so they must share one digest major. The workspace
# hmac stays 0.12.1 (digest 0.10) for hkdf/rfc6979; only this crate overrides.
hmac = "0.13"
aes.workspace = true
subtle.workspace = true
rand_core.workspace = true
jni.workspace = true
