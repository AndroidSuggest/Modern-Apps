[package]
name = "onnx-vulkan-frontend"
description = "Standalone .onnx → GraphIr loader (prost + protox), static shape inference keeping symbolic dims — no ONNX Runtime"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/automataIA/onnx-vulkan-rs"
readme = "README.md"
keywords = ["onnx", "protobuf", "inference", "gpu", "parser"]
categories = ["science", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
onnx-vulkan-core = { path = "../onnx-vulkan-core" }
prost = "0.14"
log = "0.4"

[dev-dependencies]
vk-compute = { path = "../vk-compute" }
env_logger = "0.11"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
