[package]
name = "onnx-vulkan-tune"
description = "Offline builder and GPU-free inspector for onnx-vulkan tactic artifacts"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/automataIA/onnx-vulkan-rs"
publish = false

[dependencies]
onnx-vulkan-core = { path = "../onnx-vulkan-core" }
onnx-vulkan-frontend = { path = "../onnx-vulkan-frontend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
