[package]
name = "onnx-vulkan-core"
description = "ONNX graph IR, device interpreter, WGSL shader sources, convex-block fusion and load-time rewrites — Vulkan-backed, no ONNX Runtime"
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/automataIA/onnx-vulkan-rs"
readme = "README.md"
keywords = ["onnx", "vulkan", "gpu", "inference", "neural-network"]
categories = ["science", "hardware-support"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "onnx_vulkan_core"

[dependencies]
vk-compute = { path = "../vk-compute" }
anyhow = "1"
log = "0.4"
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
serde_json = "1.0"
