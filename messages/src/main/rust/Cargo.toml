[package]
name = "whatsapp_signal"
version = "0.1.0"
edition = "2021"
description = "Classic Signal protocol v3 (X3DH + Double Ratchet + Sender Keys) for the WhatsApp bridge, exposed to Kotlin over JNI. Replaces org.whispersystems:signal-protocol-java and the :whatsapp-signal shaded module."
license = "GPL-2.0-only"

[lib]
name = "whatsapp_signal"
crate-type = ["cdylib", "rlib"]

[dependencies]
curve25519-dalek.workspace = true
x25519-dalek.workspace = true
sha2.workspace = true
hmac.workspace = true
aes.workspace = true
subtle.workspace = true
rand_core.workspace = true
jni.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
