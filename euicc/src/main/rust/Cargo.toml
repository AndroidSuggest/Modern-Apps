[package]
name = "euicc"
version = "0.1.0"
edition = "2021"
description = "SGP.22 eUICC Local Profile Assistant core (ASN.1 + ES9+/ES10 + crypto) exposed over JNI. Reimplemented for this repo, following the open-source OpenEUICC (GPL-3.0-only)."
license = "GPL-3.0-only"

[lib]
# Must match `rustNativeLib("euicc")` in build.gradle.kts and
# `System.loadLibrary("euicc")` in EuiccNative.kt: cargo emits `lib<name>.so`,
# which RustNative.kt copies into jniLibs.
name = "euicc"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
log.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
