[package]
name = "office_engine"
version = "0.1.0"
edition = "2021"
description = "Native ODF formula engine + document tree CRDT for the office app, via JNI"
license = "GPL-2.0-only"

[lib]
name = "office_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
